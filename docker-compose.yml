services:
  postgres:
    image: postgres:16-alpine
    container_name: studydesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studydesk}
      POSTGRES_USER: ${POSTGRES_USER:-studydesk_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - studydesk-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-studydesk_user} -d ${POSTGRES_DB:-studydesk}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  studydesk-postgres-data:
